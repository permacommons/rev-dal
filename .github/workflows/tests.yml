name: Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done

          psql -h localhost -U postgres -c "DROP ROLE IF EXISTS rev_dal_test_user;"
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS rev_dal_test WITH (FORCE);"

          psql -h localhost -U postgres -c "CREATE ROLE rev_dal_test_user LOGIN PASSWORD 'rev_dal_password';"
          psql -h localhost -U postgres -c "CREATE DATABASE rev_dal_test OWNER rev_dal_test_user;"
          psql -h localhost -U postgres -d rev_dal_test -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integration tests
        env:
          REV_DAL_TEST_DATABASE_URL: postgres://rev_dal_test_user:rev_dal_password@localhost:5432/rev_dal_test
        run: npm test

      - name: Run type tests
        run: npm run test:types

      - name: Check release tooling, lint, and types
        run: |
          npm run test:release
          npm run lint
          npm run typecheck

      - name: Build and pack once
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/release-artifact"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-artifact"
          mv "$RUNNER_TEMP"/release-artifact/*.tgz "$RUNNER_TEMP/release-artifact/rev-dal.tgz"
          printf 'Candidate commit: %s\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          sha512sum "$RUNNER_TEMP/release-artifact/rev-dal.tgz" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the packed exports and declarations
        run: node scripts/check-package.mjs "$RUNNER_TEMP/release-artifact/rev-dal.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: rev-dal-package
          path: ${{ runner.temp }}/release-artifact/rev-dal.tgz
          retention-days: 14
          overwrite: true

  consumers:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        consumer: [lib.reviews, agpwiki]
    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: permacommons/${{ matrix.consumer }}
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: rev-dal-package
          path: ${{ runner.temp }}/release-artifact
      - name: Record consumer commit
        env:
          CONSUMER: ${{ matrix.consumer }}
        run: |
          printf '%s main commit: %s\n' "$CONSUMER" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare consumer databases
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE libreviews_user LOGIN PASSWORD 'libreviews_password';
          CREATE DATABASE libreviews OWNER libreviews_user;
          CREATE DATABASE libreviews_test OWNER libreviews_user;
          CREATE ROLE agpwiki_user LOGIN CREATEDB PASSWORD 'agpwiki_password';
          CREATE DATABASE agpwiki_test OWNER agpwiki_user;
          SQL
          psql -h localhost -U postgres -d agpwiki_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'
      - name: Install consumer dependencies
        run: npm ci
      - name: Install the candidate package in this temporary checkout
        run: npm install --no-save "$RUNNER_TEMP/release-artifact/rev-dal.tgz"
      - name: Apply lib.reviews database grants
        if: matrix.consumer == 'lib.reviews'
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -v ON_ERROR_STOP=1
          -v app_db=libreviews -v app_user=libreviews_user
          -v test_db=libreviews_test -v test_user=libreviews_user
          -f node_modules/rev-dal/setup-db-grants.sql
      - name: Check consumer types and tests
        run: |
          npm run typecheck
          npm test
